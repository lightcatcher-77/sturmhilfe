<html lang="de">
<head>
<meta charset="utf-8">

<body>
<title>Sturmhilfe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Layout: ein ruhiger Ein-Spalten-Ablauf im Vollbild, drei Phasen (Erkennen, Verbinden, Antworten), unten immer genau eine Hauptaktion. */
:root {
  --bg: #0e1716;
  --surface: #16231f;
  --surface2: #1e302b;
  --line: #2b4741;
  --fg: #e8f0ea;
  --muted: #94ada5;
  --accent: #4cc9a4;
  --accent-ink: #06201a;
  --warm: #e8b86d;
  --danger: #e58a72;
  --display: 'Newsreader', Georgia, 'Times New Roman', serif;
  --sans: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.top { display: flex; align-items: center; gap: 12px; padding: 14px 0 6px; min-height: 64px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 18px; height: 18px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; }
.icon-btn[hidden] { display: none; }
.phases { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; min-width: 0; }
.phase { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: grid; gap: 6px; }
.phase i { display: block; height: 3px; border-radius: 2px; background: var(--line); }
.phase.on { color: var(--accent); }
.phase.on i { background: var(--accent); }
.phase.done i { background: var(--accent); opacity: .5; }

main { flex: 1; display: flex; flex-direction: column; padding: 18px 0 12px; min-width: 0; }
.foot { padding: 12px 0 calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }

h1, h2 { font-family: var(--display); font-weight: 500; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 40px; }
h2 { font-size: 31px; }
.lead { color: var(--muted); margin: 10px 0 0; max-width: 34em; }
.kicker { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.serif { font-family: var(--display); }
p { margin: 0; }
.stack { display: grid; gap: 14px; }
.grow { flex: 1; }

.btn { border: 0; border-radius: 16px; padding: 16px 20px; font-weight: 600; background: var(--accent); color: var(--accent-ink); min-height: 54px; width: 100%; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); font-weight: 500; }
.btn.warm { background: var(--warm); color: #2a1c05; }
.btn.small { width: auto; min-height: 44px; padding: 10px 16px; border-radius: 12px; }
.link { background: none; border: 0; color: var(--accent); padding: 12px; min-height: 44px; font-weight: 500; text-align: center; }
.link.muted { color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.choice { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 2px; }
.choice b { font-weight: 600; }
.choice span { color: var(--muted); font-size: 15px; }
.choice.sel { border-color: var(--accent); background: var(--surface2); }
.choice.done::after { content: "erledigt"; color: var(--accent); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; min-height: 44px; }
.chip.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Stärke */
.blobwrap { height: 190px; display: grid; place-items: center; }
.blob { border-radius: 50%; transition: all .25s ease; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 44px; }
.rangelabels { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
.strength-word { text-align: center; font-weight: 600; font-size: 20px; margin-bottom: 4px; }

/* Texte */
textarea { width: 100%; min-height: 150px; resize: vertical; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; font: inherit; line-height: 1.5; }
input[type=text] { width: 100%; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: inherit; min-height: 48px; }
.note { font-size: 14px; color: var(--muted); }
.list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.list li { display: grid; grid-template-columns: 8px 1fr; gap: 12px; align-items: start; }
.list li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: .62em; }
.sentence { font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.3; padding: 12px 0; border-top: 1px solid var(--line); }
.sentence:last-child { border-bottom: 1px solid var(--line); }
.verse { font-family: var(--display); font-size: 26px; line-height: 1.3; }
.tag { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--warm); }

/* Sehen Wollen Nehmen */
.svn { display: grid; gap: 10px; }
.svn .choice { grid-template-columns: 36px 1fr; align-items: center; column-gap: 14px; }
.svn .choice i { font-style: normal; font-family: var(--display); font-size: 26px; color: var(--accent); grid-row: span 2; }
.reply { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; }

/* Atmen */
.breath { position: fixed; inset: 0; background: #17433b; display: flex; flex-direction: column; overflow: hidden; z-index: 5; }
.breath .bar { display: flex; justify-content: space-between; align-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-left, 0px)) 0 max(18px, env(safe-area-inset-right, 0px)); position: relative; z-index: 2; color: #cfeee3; }
.breath .bar button { background: none; border: 0; color: #cfeee3; padding: 10px; min-height: 44px; }
.breath .msg { position: relative; z-index: 2; text-align: center; padding: 48px 24px 0; }
.breath .msg h2 { color: #e8f6f0; }
.breath .count { font-family: var(--sans); font-weight: 600; font-size: 88px; margin-top: 28px; color: #bff0de; font-variant-numeric: tabular-nums; }
.wave { position: absolute; left: -10%; right: -10%; bottom: 0; height: 10%; background: linear-gradient(#58c4a6, #2f8f78); border-radius: 50% 50% 0 0 / 28px 28px 0 0; transition: height 4s ease-in-out; }

/* Wellen-Anzeige */
.sea { position: relative; height: 150px; overflow: hidden; border-radius: 16px; background: var(--surface2); isolation: isolate; transform: translateZ(0); -webkit-mask-image: -webkit-radial-gradient(#fff, #000); }
.sea i { position: absolute; left: -20%; right: -20%; bottom: 0; height: 70%; border-radius: 50% 50% 0 0 / 30px 30px 0 0; background: linear-gradient(#58c4a6, #2f8f78); opacity: .6; animation: swell 10s ease-in-out infinite; }
.sea i + i { opacity: .9; height: 55%; animation-duration: 13s; animation-direction: reverse; }
@keyframes swell { 0%, 100% { transform: translateY(55%); } 50% { transform: translateY(8%); } }
@media (prefers-reduced-motion: reduce) { .sea i { animation: none; } }
/* alter Timer */
.timer { font-family: var(--sans); font-weight: 600; font-size: 72px; font-variant-numeric: tabular-nums; text-align: center; letter-spacing: -.02em; }
.track { position: relative; height: 10px; border-radius: 6px; background: var(--surface2); margin: 26px 0 30px; }
.track .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 6px; width: 0; transition: width 1s linear; }
.track .mark { position: absolute; top: 16px; transform: translateX(-50%); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track .mark::before { content: ""; position: absolute; left: 50%; top: -22px; width: 2px; height: 10px; background: var(--muted); }


/* Szenen: sanft animierte Visualisierungen im Stil der Wellen-Anzeige */
.scene { position: relative; height: 150px; width: 100%; overflow: hidden; border-radius: 16px; background: var(--surface2); isolation: isolate; transform: translateZ(0); -webkit-mask-image: -webkit-radial-gradient(#fff, #000); }
.scene i, .scene b, .scene u { position: absolute; display: block; }
.sc-breath i { left: 50%; top: 50%; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: linear-gradient(#58c4a6, #2f8f78); opacity: .35; animation: sc-breathe 10s ease-in-out infinite; }
.sc-breath i + i { width: 70px; height: 70px; margin: -35px 0 0 -35px; opacity: .85; }
@keyframes sc-breathe { 0%, 100% { transform: scale(.5); } 40% { transform: scale(1.25); } }
.sc-speak b { left: 14%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #58c4a6; }
.sc-speak i { left: 14%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 2px solid #58c4a6; opacity: 0; animation: sc-ripple 4.5s ease-out infinite; }
.sc-speak i:nth-of-type(2) { animation-delay: 1.5s; } .sc-speak i:nth-of-type(3) { animation-delay: 3s; }
@keyframes sc-ripple { 0% { transform: scale(.2); opacity: .9; } 100% { transform: scale(4.2); opacity: 0; } }
.sc-book { display: flex; align-items: center; justify-content: center; gap: 9px; }
.sc-book i { position: static; width: 9px; height: 30%; border-radius: 6px; background: linear-gradient(#58c4a6, #2f8f78); animation: sc-bar 2.8s ease-in-out infinite; }
.sc-book i:nth-child(2n) { animation-delay: -.7s; } .sc-book i:nth-child(3n) { animation-delay: -1.4s; } .sc-book i:nth-child(4) { animation-delay: -2.1s; }
@keyframes sc-bar { 0%, 100% { height: 22%; opacity: .55; } 50% { height: 66%; opacity: 1; } }
.sc-sun b { left: 50%; bottom: 20%; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%; background: linear-gradient(#f1cf8e, #e8b86d); animation: sc-rise 14s ease-in-out infinite alternate; }
.sc-sun u { left: -20%; right: -20%; bottom: 0; height: 46%; border-radius: 50% 50% 0 0 / 30px 30px 0 0; background: linear-gradient(#58c4a6, #2f8f78); opacity: .6; }
.sc-sun u + u { height: 30%; opacity: .9; left: -40%; right: 0; }
@keyframes sc-rise { from { transform: translateY(26px); } to { transform: translateY(-14px); } }
.sc-colors i { width: 90px; height: 90px; border-radius: 50%; filter: blur(10px); opacity: .75; animation: sc-drift 11s ease-in-out infinite alternate; }
.sc-colors i:nth-child(1) { left: 18%; top: 14%; background: #58c4a6; } .sc-colors i:nth-child(2) { left: 40%; top: 30%; background: #e8b86d; animation-duration: 13s; } .sc-colors i:nth-child(3) { left: 60%; top: 10%; background: #8fb0ee; animation-duration: 9s; }
@keyframes sc-drift { from { transform: translate(-24px, 8px) scale(.9); } to { transform: translate(26px, -10px) scale(1.15); } }
.sc-ball b { left: 50%; bottom: 14%; width: 70px; height: 10px; margin-left: -35px; border-radius: 50%; background: #000; opacity: .18; animation: sc-shadow 3.2s ease-in-out infinite; }
.sc-ball i { left: 50%; top: 50%; width: 70px; height: 70px; margin: -42px 0 0 -35px; border-radius: 50%; background: linear-gradient(#58c4a6, #2f8f78); animation: sc-squeeze 3.2s ease-in-out infinite; }
@keyframes sc-squeeze { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.3, .72) translateY(10%); } }
@keyframes sc-shadow { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(1.35); } }
.sc-people i { top: 50%; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; background: linear-gradient(#58c4a6, #2f8f78); animation: sc-gather 6s ease-in-out infinite; }
.sc-people i:nth-child(1) { left: 50%; margin-left: -15px; --x: -88px; } .sc-people i:nth-child(2) { left: 50%; margin-left: -15px; --x: 0px; background: linear-gradient(#f1cf8e, #e8b86d); } .sc-people i:nth-child(3) { left: 50%; margin-left: -15px; --x: 88px; }
@keyframes sc-gather { 0%, 100% { transform: translateX(var(--x)); opacity: .6; } 50% { transform: translateX(calc(var(--x) * .3)); opacity: 1; } }
.sc-bolt i { height: 3px; border-radius: 2px; background: #58c4a6; opacity: .8; left: -40%; width: 40%; animation: sc-dash 1.6s linear infinite; }
.sc-bolt i:nth-child(1) { top: 24%; animation-duration: 1.3s; } .sc-bolt i:nth-child(2) { top: 42%; animation-duration: 1.9s; animation-delay: -.6s; width: 55%; } .sc-bolt i:nth-child(3) { top: 60%; animation-duration: 1.5s; animation-delay: -1s; } .sc-bolt i:nth-child(4) { top: 78%; animation-duration: 2.2s; animation-delay: -.3s; width: 50%; }
@keyframes sc-dash { to { transform: translateX(420%); } }
@media (prefers-reduced-motion: reduce) { .scene i, .scene b, .scene u { animation: none !important; } }

/* Biochemie: Dopamin-Baseline als Linie, die sich zeichnet; Zeilen leuchten im Takt (Loop 12 s) */
.chem { width: 100%; background: var(--surface2); border-radius: 16px; padding: 10px 8px 4px; }
.chem svg { display: block; width: 100%; height: auto; overflow: visible; }
.chem .ref { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; opacity: .6; }
.chem .lbl { fill: var(--muted); font: 500 10px var(--sans); }
.chem .crave { fill: var(--danger); opacity: 0; animation: ch-crave 12s ease-in-out infinite; }
.chem .line { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: ch-draw 12s linear infinite; }
.chem .tick { stroke: var(--warm); stroke-width: 1.5; stroke-dasharray: 2 3; opacity: 0; animation: ch-tick 12s linear infinite; }
.chem .tlbl { fill: var(--warm); opacity: 0; animation: ch-tick 12s linear infinite; }
.chem .dot { display: none; fill: var(--accent); opacity: 0; animation: ch-dot 12s linear infinite; }
@supports (offset-path: path("M0 0")) {
  .chem .dot { display: block; offset-path: path("M12 36 C50 36 66 82 108 82 L146 82 C162 82 172 54 192 54 C218 54 228 108 254 108 L308 108"); offset-rotate: 0deg; }
}
@keyframes ch-draw { 0% { stroke-dashoffset: 100; opacity: 1; } 70%, 92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
@keyframes ch-dot { 0% { offset-distance: 0%; opacity: 1; } 70% { offset-distance: 100%; opacity: 1; } 76%, 100% { offset-distance: 100%; opacity: 0; } }
@keyframes ch-crave { 0%, 14% { opacity: 0; } 22% { opacity: .22; } 30% { opacity: .1; } 38% { opacity: .22; } 44%, 100% { opacity: 0; } }
@keyframes ch-tick { 0%, 40% { opacity: 0; } 46%, 90% { opacity: 1; } 100% { opacity: 0; } }
.chem-rows { display: grid; gap: 12px; margin-top: 18px; }
.chem-rows p { margin: 0; display: grid; grid-template-columns: 10px 1fr; gap: 12px; align-items: baseline; line-height: 1.35; opacity: .5; animation: ch-row 12s ease-in-out infinite; }
.chem-rows p::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.chem-rows p:nth-child(1)::before { background: var(--danger); }
.chem-rows p:nth-child(2)::before { background: var(--warm); }
.chem-rows p:nth-child(2) { animation-name: ch-row2; }
.chem-rows p:nth-child(3) { animation-name: ch-row3; }
.chem-rows b { font-weight: 600; }
@keyframes ch-row { 0% { opacity: 1; } 36% { opacity: 1; } 46%, 92% { opacity: .5; } 100% { opacity: 1; } }
@keyframes ch-row2 { 0%, 36% { opacity: .5; } 46%, 62% { opacity: 1; } 72%, 100% { opacity: .5; } }
@keyframes ch-row3 { 0%, 62% { opacity: .5; } 74%, 92% { opacity: 1; } 100% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) {
  .chem .line, .chem .dot, .chem .crave, .chem .tick, .chem .tlbl, .chem-rows p { animation: none !important; }
  .chem .line { stroke-dashoffset: 0; } .chem .tick, .chem .tlbl { opacity: 1; } .chem .crave { opacity: .18; } .chem .dot { display: none; } .chem-rows p { opacity: 1; }
}

/* Blasen */
.bubbles { display: flex; flex-wrap: wrap; gap: 12px 10px; justify-content: center; padding: 14px 0 4px; min-height: 190px; align-content: flex-start; }
.bub { border: 1px solid #2bc6c0; background: rgba(43, 198, 192, .16); color: var(--fg); border-radius: 999px; padding: 12px 18px; min-height: 44px; max-width: 100%; text-align: center; animation: bob var(--d, 5s) ease-in-out var(--dl, 0s) infinite alternate; }
.bub.sel { background: #2bc6c0; color: #05302f; border-color: #2bc6c0; font-weight: 600; box-shadow: 0 0 18px rgba(43, 198, 192, .45); }
@keyframes bob { 0% { transform: translate(0, 0); } 50% { transform: translate(calc(var(--dx, 8px) * .4), calc(var(--dy, -16px) * 1.1)); } 100% { transform: translate(var(--dx, 8px), var(--dy, -16px)); } }
@media (prefers-reduced-motion: reduce) { .bub { animation: none; } }
/* Kreuz */
.csteps { display: grid; gap: 22px; width: 100%; }
.cstep { opacity: 0; transform: translateY(10px); animation: cfade 1.4s ease forwards; }
.cstep h2 { font-size: 26px; }
@keyframes cfade { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .cstep { animation: none; opacity: 1; transform: none; } }
.jesus { display: block; width: auto; max-width: 100%; height: auto; max-height: 64vh; margin: 0 auto; object-fit: contain; border-radius: 18px; border: 1px solid var(--line); }
.cross { text-align: center; display: grid; gap: 18px; justify-items: center; padding-top: 8px; }
.cross svg { width: 70px; height: 96px; stroke: var(--warm); stroke-width: 3; fill: none; stroke-linecap: round; }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--warm); }

/* Verlauf */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; }
.tile b { display: block; font-family: var(--display); font-weight: 500; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { display: block; font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.25; }
.entry { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.entry small { color: var(--muted); }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; align-self: start; white-space: nowrap; }
.pill.held { background: rgba(76,201,164,.16); color: var(--accent); }
.pill.fell { background: rgba(229,138,114,.16); color: var(--danger); }
.bars { display: grid; gap: 8px; }
.bars div { display: grid; grid-template-columns: 110px 1fr 24px; gap: 10px; align-items: center; font-size: 14px; }
.bars span.b { height: 8px; border-radius: 4px; background: var(--surface2); position: relative; overflow: hidden; }
.bars span.b i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }

.planrow { display: grid; grid-template-columns: 1fr 44px; gap: 8px; align-items: stretch; }
.del { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; color: var(--muted); }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; }
.status { margin-top: 22px; gap: 10px; }
.status p { color: var(--fg); font-family: var(--display); font-size: 20px; line-height: 1.3; }
.week { display: flex; gap: 8px; min-height: 12px; }
.week i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.week i.good { background: var(--accent); }
.week i.hard { background: var(--warm); }
.zhead { display: flex; justify-content: space-between; align-items: center; }
.zhead .link { padding: 4px 8px; min-height: 36px; }
.zrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.zbtns { display: flex; gap: 6px; flex: none; }
.zb { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); filter: grayscale(1); opacity: .6; }
.zb.on { opacity: 1; filter: none; color: var(--fg); border-color: var(--muted); background: var(--surface2); }
.zb.ok.on { border-color: var(--accent); }
.zb.bad.on { border-color: var(--danger); }
.btn:disabled { opacity: .6; }
.toast { color: var(--accent); font-size: 14px; min-height: 20px; }
@media (prefers-reduced-motion: reduce) { .wave, .blob, .track .fill { transition: none; } }
</style>

<div id="app">
  <header class="top">

      else if (!N.hist) notion = '<p class="note">Lade Recovery Zone aus Notion …</p>';
      else notion = '<div class="card stack"><b>Recovery Zone (Notion)</b>' + (N.hist.filter(function (h) { return h.ok || h.bad || h.note; }).slice(0, 14).map(function (h) {
        return '<div class="entry"><div><b>' + esc(h.tag || h.date) + '</b>' + (h.note ? '<br><small>' + esc(h.note).replace(/\n/g, '<br>') + '</small>' : '') + '</div><span class="pill ' + (h.bad ? 'fell' : 'held') + '">' + h.ok + ' ✅' + (h.bad ? ' · ' + h.bad + ' ❌' : '') + '</span></div>';
      }).join('') || '<p class="note">Noch nichts eingetragen.</p>') + '</div>';
    }
    if (!DB.log.length && !nDays.length && !(N.hist && N.hist.length)) return '<div class="stack"><h2>Verlauf</h2><p class="lead">Noch keine Einträge. Nach dem ersten durchgestandenen Urge siehst du hier deine Muster.</p>' + notion + '</div><div class="grow"></div><div class="foot"><button class="btn ghost" data-act="home">Zurück</button></div>';
    return '<div class="stack"><h2>Verlauf</h2>' +
      '<div class="tiles"><div class="tile"><b>' + held.length + '</b><span>Stürme ausgehalten</span></div>' +
      '<div class="tile"><b>' + (days === null ? '–' : days) + '</b><span>' + (days === null ? 'Tage seit Rückfall' : 'Tage seit letztem Rückfall') + '</span></div>' +
      '<div class="tile"><b>' + (avg === null ? '–' : (avg > 0 ? '−' : '') + Math.abs(avg).toFixed(1).replace('.', ',')) + '</b><span>Stärke im Schnitt vorher zu nachher</span></div></div>' +
      (plist.length ? '<div class="card stack"><b>Wo es passiert</b><div class="bars">' + plist.map(function (p) { return '<div><span>' + esc(p) + '</span><span class="b"><i style="width:' + (places[p] / maxp * 100) + '%"></i></span><span>' + places[p] + '</span></div>'; }).join('') + '</div>' +
        (withAlone.length ? '<p class="note">' + aloneN + ' von ' + withAlone.length + ' Malen warst du allein.</p>' : '') + '</div>' : '') +
      notion +
      '<div>' + L.slice(0, 30).map(function (e) {
        return '<div class="entry"><div><b>' + fmt(e.t) + '</b><br><small>' + esc(e.place || 'Ort offen') + (e.alone === true ? ' · allein' : e.alone === false ? ' · nicht allein' : '') + (e.before ? ' · Stärke ' + e.before + (e.after ? ' → ' + e.after : '') : '') + '</small></div><span class="pill ' + e.outcome + '">' + (e.outcome === 'held' ? 'ausgehalten' : 'Rückfall') + '</span></div>';
      }).join('') + '</div></div>' +
      '<div class="grow"></div><div class="foot"><button class="btn ghost" data-act="home">Zurück</button></div>';
  };

  /* ---------- Render & Events ---------- */
  function render() {
    chrome();
    $v.innerHTML = S[cur]();
    if (cur === 'strength') { var r = document.getElementById('rng'); r.addEventListener('input', blob); blob(); }
    if (cur === 'done') { var r2 = document.getElementById('rng2'); r2.addEventListener('input', blob2); blob2(); }
    if (cur === 'hist' && !N.histBusy) { N.histBusy = true; nLoadHist(); }
    if (cur !== 'hist') N.histBusy = false;
    if (cur === 'breath') runBreath();
    if (cur === 'wave') runWave();
    if (cur === 'why') { var w = document.getElementById('whytxt'); w.addEventListener('input', function () { DB.why = w.value; wpChanged(); }); }
    var nt = document.getElementById('newtrig');
    if (nt) { nt.value = D.newtrig || ''; nt.addEventListener('input', function () { D.newtrig = nt.value; }); }
    var nl = document.getElementById('newlie');
    if (nl && (cur === 'place' || cur === 'fall')) { nl.value = D.newlie || ''; nl.addEventListener('input', function () { D.newlie = nl.value; }); }
    if (cur === 'place' || cur === 'fall') nLoadLies();
    var nm = document.getElementById('newmiss');
    if (nm) { nm.value = D.newmiss || ''; nm.addEventListener('input', function () { D.newmiss = nm.value; }); }
    var fr = document.getElementById('frng');
    if (fr) fr.addEventListener('input', function () { D.strength = +fr.value; document.getElementById('frv').textContent = fr.value; });
    var np = document.getElementById('newplace');
    if (np) np.addEventListener('input', function () { D.custom = np.value; });
    if (cur === 'cost') { var cb = document.getElementById('cbtxt'); cb.addEventListener('input', function () { DB.cbi[D.cbx || 0] = cb.value; save(); }); }
    if (cur === 'lies') { nLoadLies(); D.lx = D.lx || 0; Array.prototype.forEach.call(document.querySelectorAll('[data-truth]'), function (t) { t.addEventListener('input', function () { DB.truths = DB.truths || {}; DB.truths[D.liesSel[+t.getAttribute('data-truth')]] = t.value; save(); }); }); }
    var zn = document.getElementById('znote');
    if (zn) zn.addEventListener('input', function () { Z.note = zn.value; });
    var m = document.getElementById('msg');
    if (m) m.addEventListener('input', function () { DB[m.getAttribute('data-key') || 'msg'] = m.value; save(); });
  }

  var ACT = {
    start: function () { D = {}; stack = []; cur = 'home'; go('strength'); },
    next: function () { if (cur === 'place') commitPlace(); next(); },
    home: home,
    whyHome: function () { D = { standalone: true }; go('why'); },
    planHome: function () { D = { standalone: true }; go('plan'); },
    breathSkip: function () { afterBreath(); },
    crossNext: function () { D.cx = (D.cx || 0) + 1; render(); },
    fallNext: function () { if (D.fx === 3) commitPlace(); D.fx = (D.fx || 0) + 1; render(); },
    addBub: function () {
      var i = document.getElementById('newbub'), v = i.value.trim().slice(0, 40); if (!v) return;
      var known = (DB.bubbles || []).filter(function (x) { return x.toLowerCase() === v.toLowerCase(); })[0];
      D.loveSel = D.loveSel || [];
      if (!known) { DB.bubbles = (DB.bubbles || []).concat(v); save(); if (N.mcp) nEnsureOpts({ 'Ich will sein': [clean(v)] }).catch(function () {}); }
      var use = known || v; if (D.loveSel.indexOf(use) < 0) D.loveSel.push(use);
      render();
    },
    cbNext: function () { D.cbx = (D.cbx || 0) + 1; render(); window.scrollTo(0, 0); },
    liesNext: function () { if ((D.liesSel || []).length) { D.lx = 1; render(); window.scrollTo(0, 0); } },
    liesSkip: function () { D.lx = 0; history_pop(); },
    addLie: function () {
      var i = document.getElementById('newlie'), v = i.value.trim().slice(0, 120); if (!v) return;
      var known = allLies().filter(function (x) { return x.toLowerCase() === v.toLowerCase(); })[0];
      D.liesSel = D.liesSel || [];
      if (known) { if (D.liesSel.indexOf(known) < 0) D.liesSel.push(known); D.liesNote = 'Diese Lüge gibt es schon, sie ist ausgewählt.'; render(); return; }
      DB.lies = (DB.lies || []).concat(v); save(); D.liesSel.push(v); D.liesNote = 'Gespeichert.'; D.newlie = ''; render(); nAddLie(v);
    },
    connDone: function (el) { if (el.getAttribute('data-k') === 'lies') { N.liesLogNote = ''; nLogLies(D.liesSel || []); } markConn(el.getAttribute('data-k')); D.cx = 0; D.lx = 0; D.cbx = 0; history_pop(); },
    addPlan: function () { var i = document.getElementById('newplan'), v = i.value.trim(); if (v) { DB.plan.push(v); wpChanged(); render(); } },
    copy: function () {
      var t = document.getElementById('msg'), ts = document.getElementById('toast');
      function ok() { ts.textContent = 'Kopiert.'; }
      try { navigator.clipboard.writeText(t.value).then(ok, function () { t.select(); ts.textContent = 'Text markiert, jetzt kopieren.'; }); } catch (e) { t.select(); ts.textContent = 'Text markiert, jetzt kopieren.'; }
    },
    finish: function () {
      DB.log.push({ t: Date.now(), before: D.strength, after: D.after || null, place: D.place, alone: D.alone === undefined ? null : D.alone, mode: D.mode || null, outcome: 'held', miss: D.miss || [], svn: D.svn === undefined ? null : D.svn, trig: D.trig || [] });
      save(); N.note = ''; nEvent(true);
      nLog(hhmm() + ' Urge ausgehalten, Stärke ' + D.strength + (D.after ? ' → ' + D.after : '') + (D.place ? ', ' + D.place : ''));
      stack = []; cur = 'end'; render();
    },
    zoneSave: zSave,
    nRetry: function () { N.histErr = ''; nLoadHist(); wpLoad(); render(); },
    addMiss: function () {
      var v = (D.newmiss || '').trim().slice(0, 40); if (!v) return;
      var have = allMiss().filter(function (x) { return x.toLowerCase() === v.toLowerCase(); })[0];
      if (!have) { DB.miss = (DB.miss || []).concat(v); have = v; save(); }
      D.miss = D.miss || []; if (D.miss.indexOf(have) < 0) D.miss.push(have);
      D.newmiss = ''; render();
    },
    addTrig: function () {
      var v = (D.newtrig || '').trim().slice(0, 60); if (!v) return;
      var have = allTrig().filter(function (x) { return x.toLowerCase() === v.toLowerCase(); })[0];
      if (!have) { DB.trig = (DB.trig || []).concat(v); have = v; save(); }
      D.trig = D.trig || []; if (D.trig.indexOf(have) < 0) D.trig.push(have);
      D.newtrig = ''; render();
    },
    fallSave: function () {
      commitPlace();
      DB.log.push({ t: Date.now(), outcome: 'fell', fp: D.fp || [], place: D.place || null, alone: D.alone === undefined ? null : D.alone, before: D.strength || null, svn: D.svn === undefined ? null : D.svn, trig: D.trig || [], miss: D.miss || [] });
      save(); nEvent(false); nLog(hhmm() + ' Rückfall' + ((D.fp || []).length ? ': ' + D.fp.join(', ') : '')); nMarkFall(D.fp || []); home();
    }
  };
  function history_pop() { cur = stack.pop() || 'connect'; render(); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('button, [data-go]');
    if (!el) return;
    if (el.id === 'back') { cur = stack.pop() || 'home'; stopTimer(); render(); return; }
    if (el.id === 'close') { home(); return; }
    if (el.dataset.act) { ACT[el.dataset.act](el); return; }
    if (el.dataset.go === 'zone') { D = {}; Z.day = 0; Z.msg = ''; go('zone'); zLoad(); return; }
    if (el.dataset.lie !== undefined) { var li = el.dataset.lie, ix = (D.liesSel = D.liesSel || []).indexOf(li); if (ix >= 0) D.liesSel.splice(ix, 1); else D.liesSel.push(li); D.liesNote = ''; render(); return; }
    if (el.dataset.bub !== undefined) { var bu = el.dataset.bub, bi = (D.loveSel = D.loveSel || []).indexOf(bu); if (bi >= 0) D.loveSel.splice(bi, 1); else D.loveSel.push(bu); render(); return; }
    if (el.dataset.zday !== undefined) { Z.day = +el.dataset.zday; zLoad(); return; }
    if (el.dataset.zs) { var pr = el.dataset.zs.split('|'); Z.vals[pr[0]] = STATE[pr[1]]; Z.msg = ''; render(); return; }
    if (el.dataset.zall) { ZONES.forEach(function (z) { if (z[0] === el.dataset.zall) z[1].forEach(function (k) { Z.vals[k] = STATE.ok; }); }); Z.msg = ''; render(); return; }
    if (el.dataset.go === 'lies') { D.lx = 0; N.liesErr = ''; }
    if (el.dataset.go === 'cost') D.cbx = 0;
    if (el.dataset.go) { if (el.dataset.go === 'fall') D = {}; go(el.dataset.go); return; }
    if (el.dataset.miss !== undefined) { var mk = el.dataset.miss, mi = (D.miss = D.miss || []).indexOf(mk); if (mi >= 0) D.miss.splice(mi, 1); else D.miss.push(mk); render(); return; }
    if (el.dataset.fp !== undefined) { var fk = el.dataset.fp, fi = (D.fp = D.fp || []).indexOf(fk); if (fi >= 0) D.fp.splice(fi, 1); else D.fp.push(fk); render(); return; }
    if (el.dataset.trig !== undefined) { var tg = el.dataset.trig, ti = (D.trig = D.trig || []).indexOf(tg); if (ti >= 0) D.trig.splice(ti, 1); else D.trig.push(tg); render(); return; }
    if (el.dataset.place !== undefined) { D.place = el.dataset.place; render(); return; }
    if (el.dataset.alone !== undefined) { D.alone = el.dataset.alone === '1'; render(); return; }
    if (el.dataset.svn !== undefined) { D.svn = +el.dataset.svn; render(); return; }
    if (el.dataset.mode) { D.mode = el.dataset.mode; next(); return; }
    if (el.dataset.pmode) { D.mode = el.dataset.pmode; render(); return; }
    if (el.dataset.min) { D.mins = +el.dataset.min; D.breathSec = Math.round(D.mins * 60); go('breath'); return; }
    if (el.dataset.pick !== undefined) { D.next = DB.plan[+el.dataset.pick]; render(); return; }
    if (el.dataset.del !== undefined) { DB.plan.splice(+el.dataset.del, 1); wpChanged(); render(); return; }
  });

  render();
})();
</script>

</body>
</html>
