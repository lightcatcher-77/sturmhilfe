<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Recovery Zone Übersicht</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2430;--mu:#6b7080;--ok:#2f8f5b;--bad:#c4473a;--line:#e4e0d6}
@media(prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1d2028;--tx:#e8e9ee;--mu:#9296a5;--ok:#4cc084;--bad:#e5685b;--line:#2b2f3a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--mu);font-size:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi b{display:block;font-size:30px;line-height:1.1}.kpi span{font-size:13px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid div{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--ok);color:#fff}
.grid .bad{background:var(--bad)}.grid .none{background:transparent}.grid .hd{background:transparent;color:var(--mu);aspect-ratio:auto}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0}.row span:last-child{color:var(--mu);white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bad)}
.foot{font-size:12px;color:var(--mu);margin-top:18px}
</style></head><body><main>
<h1>Recovery Zone</h1>
<div class="sub" id="sub"></div>
<div class="card"><div class="kpis" id="kpis"></div></div>
<div class="card"><h2>Verlauf</h2><div class="grid" id="grid"></div>
<div class="foot">Grün = kein Rückfall bei den vier Kernpunkten (Pornografie, Masturbation, Edging, Lüstern). Rot = mindestens ein Rückschlag.</div></div>
<div class="card"><h2>Rückschläge pro Bereich</h2><div id="zonen"></div></div>
<div class="card"><h2>Häufigste Lügen</h2><div id="lies"></div></div>
<div class="foot">Momentaufnahme, kein Live-Stand. Heutiger Tag ist noch offen und zählt nicht mit.</div>
</main>
<script>
var D={"stand": "2026-11-28", "tage": {"2026-10-27": [], "2026-10-28": ["Pornografie", "Masturbation", "Fantasien", "Chaos in mir"], "2026-10-29": ["Fantasien", "Chaos in mir"], "2026-10-30": ["Pornografie", "Lesen", "Fantasien"], "2026-10-31": ["Pornografie", "Fantasien"], "2026-11-01": [], "2026-11-02": [], "2026-11-03": [], "2026-11-04": ["Pornografie"], "2026-11-05": [], "2026-11-06": [], "2026-11-07": [], "2026-11-08": [], "2026-11-09": ["Pornografie", "Lüstern", "Zeit draußen", "Lesen"], "2026-11-10": ["Pornografie", "Masturbation", "Edging", "Zeit draußen", "Lesen"], "2026-11-11": ["Pornografie", "Masturbation", "Lesen", "Chaos in mir"], "2026-11-12": ["Scrollen", "Lesen", "Chaos in mir"], "2026-11-13": ["Pornografie", "Lesen"], "2026-11-14": ["Fantasien"], "2026-11-15": ["Pornografie", "Zeit draußen"], "2026-11-16": ["Pornografie", "Masturbation", "Lesen"], "2026-11-17": ["Zeit draußen", "Lesen"], "2026-11-18": ["Zeit draußen"], "2026-11-19": ["Zeit draußen"], "2026-11-20": [], "2026-11-21": [], "2026-11-22": ["Zeit mit Gott", "Zeit draußen"], "2026-11-23": ["Masturbation", "Zeit draußen", "Fantasien", "Chaos in mir"], "2026-11-24": [], "2026-11-25": [], "2026-11-26": [], "2026-11-27": ["Lesen"]}, "urges": {"2026-10-29": 3, "2026-10-30": 3, "2026-10-31": 5, "2026-11-02": 1, "2026-11-03": 1, "2026-11-04": 1, "2026-11-09": 1, "2026-11-10": 1, "2026-11-14": 2, "2026-11-18": 1, "2026-11-23": 1}, "gedanken": [["Nur kurz schauen", 9], ["Sie stillt gerade mein Bedürfnis nach Nähe und Liebe", 6], ["Es ist egal", 5], ["Endlich gibt mir jemand Liebe, ohne dass ich sie an mich reißen muss", 5], ["Sie gehört mir in diesem Moment.", 5], ["Zu müde zum Kämpfen", 4]]};
var CORE=["Pornografie","Masturbation","Edging","Lüstern"];
var days=Object.keys(D.tage).sort();
function bad(d){return D.tage[d].some(function(z){return CORE.indexOf(z)>=0})}
var clean=days.filter(function(d){return !bad(d)}).length;
var streak=0;for(var i=days.length-1;i>=0&&!bad(days[i]);i--)streak++;
var urges=0;for(var k in D.urges)urges+=D.urges[k];
function fmt(d){var p=d.split("-");return p[2]+"."+p[1]+"."}
document.getElementById("sub").textContent="Stand "+fmt(D.stand)+"2026 · "+days.length+" Tage ausgewertet ("+fmt(days[0])+" bis "+fmt(days[days.length-1])+")";
document.getElementById("kpis").innerHTML=
 [[streak,"Tage am Stück sauber"],[clean+"/"+days.length,"saubere Tage"],[urges,"Urges ausgehalten"]]
 .map(function(x){return '<div class="kpi"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join("");
var g=document.getElementById("grid"),h="";
["Mo","Di","Mi","Do","Fr","Sa","So"].forEach(function(n){h+='<div class="hd">'+n+'</div>'});
var first=new Date(days[0]+"T12:00:00"),off=(first.getDay()+6)%7;
for(var j=0;j<off;j++)h+='<div class="none"></div>';
days.forEach(function(d){h+='<div class="'+(bad(d)?'bad':'')+'">'+parseInt(d.slice(8),10)+'</div>'});
g.innerHTML=h;
var cnt={};days.forEach(function(d){D.tage[d].forEach(function(z){cnt[z]=(cnt[z]||0)+1})});
var zs=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]}),mx=cnt[zs[0]]||1;
document.getElementById("zonen").innerHTML=zs.map(function(z){return '<div style="padding:6px 0"><div class="row" style="border:0;padding:0"><span>'+z+'</span><span>'+cnt[z]+(cnt[z]==1?' Tag':' Tage')+'</span></div><div class="bar"><i style="width:'+(cnt[z]/mx*100)+'%"></i></div></div>'}).join("");
document.getElementById("lies").innerHTML=D.gedanken.map(function(x){return '<div class="row"><span></span><span>'+x[1]+' Tage</span></div>'}).join("");
var rows=document.querySelectorAll("#lies .row");D.gedanken.forEach(function(x,i){rows[i].firstChild.textContent="„"+x[0]+"“"});
</script></body></html>
